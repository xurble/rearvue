# https://docs.github.com/github/administering-a-repository/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/src"
    schedule:
      interval: "weekly"
    ignore:
      # Django 6.1+ requires MySQL 8.4; production runs MySQL 8.0.
      # Remove once the database is upgraded.
      - dependency-name: "django"
        versions: [">=6.1"]
